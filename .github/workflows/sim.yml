name: Scenario simulations
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated scenario names (empty = all)"
        required: false
        default: ""
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  simulate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sim]')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build Atlas (test build) and the replica apps
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"; echo "sdk.dir=$SDK" > local.properties
          gradle :app:assembleSim :sim:assembleDebug --no-daemon 2>&1 | tail -30
          cp app/build/outputs/apk/sim/app-sim.apk Atlas-sim.apk
          mkdir -p sim-apks && find sim/build/outputs/apk -name "*.apk" -exec cp {} sim-apks/ \;
          ls sim-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run scenarios on an Android 14 emulator with Gemini
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/sim/run.sh
      - name: Publish report and screenshots to the sim-results branch
        if: always()
        run: |
          [ -d sim-out ] || exit 0
          cd sim-out && git init -q -b sim-results && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "sim ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sim-results
